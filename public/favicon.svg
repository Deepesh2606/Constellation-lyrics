<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3355" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <!-- Background Chassis -->
  <rect width="64" height="64" rx="16" fill="#090a0f"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(255, 77, 109, 0.4)" stroke-width="1.5"/>

  <!-- Radial Glow Aura -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>

  <!-- Constellation Connecting Lines -->
  <path d="M16 44 L32 32 L48 20 M32 32 L46 44 M32 32 L18 20" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- Satellite Star Nodes -->
  <circle cx="16" cy="44" r="2.5" fill="#ff4d6d"/>
  <circle cx="48" cy="20" r="2.5" fill="#ff4d6d"/>
  <circle cx="46" cy="44" r="2" fill="#fda4af"/>
  <circle cx="18" cy="20" r="2" fill="#fda4af"/>

  <!-- Central Constellation Sparkle -->
  <path d="M32 10 Q32 32 10 32 Q32 32 32 54 Q32 32 54 32 Q32 32 32 10 Z" fill="url(#starGrad)"/>
  <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>
</svg>

